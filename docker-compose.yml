services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar_password}
      POSTGRES_DB: ${POSTGRES_DB:-radar}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radar} -d ${POSTGRES_DB:-radar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      FRAMES_DIR: /data/frames
    ports:
      - "8000:8000"
    volumes:
      - frames:/data/frames
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  ingestor:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.ingestor"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      FRAMES_DIR: /data/frames
    volumes:
      - frames:/data/frames
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  frames:
