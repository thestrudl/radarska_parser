<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slovenia Radar — Precipitation History</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>🌧️ Slovenia Radar</h1>
    <p>Click anywhere on the map (or search an address) to see past precipitation.</p>
  </header>

  <div id="controls">
    <input id="address" type="text" placeholder="e.g. Ljubljana, Slovenia" />
    <button id="search-btn">Search</button>
    <select id="range">
      <option value="6">Last 6 h</option>
      <option value="24" selected>Last 24 h</option>
      <option value="72">Last 3 days</option>
      <option value="168">Last 7 days</option>
    </select>
    <label class="radar-ctl"><input type="checkbox" id="radar-toggle" checked /> Radar</label>
    <label class="radar-ctl">Opacity
      <input type="range" id="radar-opacity" min="0" max="1" step="0.05" value="0.6" />
    </label>
    <span id="frame-time"></span>
    <span id="status"></span>
  </div>

  <div id="layout">
    <div id="map"></div>
    <div id="chart-panel">
      <h2 id="chart-title">Pick a point</h2>
      <canvas id="chart"></canvas>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
